# Remake the candidates where this repository makes them, unless asked to check them as committed,
# check them all, and show the reports.
#
# Started by hand only, on the branch chosen in the form. Commits the candidates and reports to that
# branch only if asked. The run fails only if the checks could not run; how the candidates fared is in
# the reports.

name: Check the candidate declarations

on:
  workflow_dispatch:
    inputs:
      make-candidates:
        description: Make the candidates first, where this repository makes them; untick to check them as committed
        default: true
        type: boolean
      commit:
        description: Commit the candidates and reports to this branch
        default: false
        type: boolean

# Writing is needed only to commit; a run changes nothing but the branch it ran on.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The image runs as a user that cannot otherwise write to the runner's checkout, including the
      # directories the Makefile creates for each session.
      - name: Let the image write the candidates and reports
        run: |
          mkdir -p .repro-logs .repro-sessions/active
          chmod -R a+rwX .

      - name: Build the image
        run: make build-image

      # Only a repository whose repro-config defines build-candidates makes its own candidates.
      # Git in the image refuses a checkout owned by another user unless told to trust it.
      - name: Remake the candidates
        run: |
          if [ "${{ inputs.make-candidates }}" != true ]; then
            echo "Asked to check the candidates as committed."
          elif grep -q '^build-candidates:' repro-config; then
            make build-candidates REPRO_INTERACTIVE_SESSION=false \
                REPRO_DOCKER_OPTIONS="--env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env 'GIT_CONFIG_VALUE_0=*'"
          else
            echo "This repository does not make its candidates; checking them as committed."
          fi

      - name: Check the candidates
        run: |
          make build-reports REPRO_INTERACTIVE_SESSION=false \
              REPRO_DOCKER_OPTIONS="--env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env 'GIT_CONFIG_VALUE_0=*'"

      - name: Show the reports
        run: |
          {
            if [ -n "$(git status --porcelain -- candidates reports)" ]; then
              echo "> The candidates or reports differ from those committed on this branch."
            else
              echo "> The candidates and reports are the same as those committed on this branch."
            fi
            echo
            cat reports/integrated-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the candidates and reports
        uses: actions/upload-artifact@v7
        with:
          name: candidates-and-reports
          path: |
            candidates/
            reports/

      - name: Commit the candidates and reports
        if: inputs.commit
        run: |
          if [ -z "$(git status --porcelain -- candidates reports)" ]; then
            echo "Nothing to commit: the candidates and reports are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- candidates reports
          if [ "${{ inputs.make-candidates }}" = true ]; then
            git commit -m "Remake the candidates and reports"
          else
            git commit -m "Check the candidates as committed and update the reports"
          fi
          git push
