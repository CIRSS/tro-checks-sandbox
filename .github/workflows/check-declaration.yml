# Check one declaration, pasted into the form, on its own: no signature, no other artifacts.
#
# Started by hand only. Shows the report on the run's page and commits nothing. The run fails only if
# the declaration could not be checked; how it fared is in the report.

name: Check a declaration

on:
  workflow_dispatch:
    inputs:
      declaration:
        description: The TRO declaration, pasted
        required: true
        type: string
      version:
        description: The version to check it against
        default: trace-main
        type: string
      tier:
        description: The tier to check it for
        default: STANDALONE-TRO
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image runs as a user that cannot otherwise write to the runner's checkout, including the
      # directories the Makefile creates for each session.
      - name: Let the image write the report
        run: |
          mkdir -p .repro-logs .repro-sessions/active pasted
          chmod -R a+rwX .

      - name: Build the image
        run: make build-image

      # The form's values reach the shell through the environment, never spliced into the script.
      - name: Save the declaration
        env:
          DECLARATION: ${{ inputs.declaration }}
        run: printf '%s\n' "$DECLARATION" > pasted/declaration.jsonld

      # Git in the image refuses a checkout owned by another user unless told to trust it.
      - name: Check the declaration
        env:
          VERSION: ${{ inputs.version }}
          TIER: ${{ inputs.tier }}
        run: |
          make check-declaration DECLARATION=pasted/declaration.jsonld REPORT=pasted/report.md \
              VERSION="$VERSION" TIER="$TIER" REPRO_INTERACTIVE_SESSION=false \
              REPRO_DOCKER_OPTIONS="--env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env 'GIT_CONFIG_VALUE_0=*'"

      - name: Show the report
        run: cat pasted/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: pasted/report.md
